<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FOX Nation Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
</style>
</head>
<body class="min-h-screen bg-zinc-50">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-60 flex-none bg-zinc-900 text-white">
      <div class="flex items-center gap-2 px-5 py-5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-red-700 font-bold">D</div>
        <span class="font-semibold tracking-wide">DIGITAL OPERATIONS</span>
      </div>
      <nav class="mt-2 space-y-1 px-3">
        <a href="index.html" data-nav="dashboard" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-800">
          <span>▦</span> Dashboard
        </a>
        <a href="huddle.html" data-nav="huddle" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-800">
          <span>💬</span> Huddle Notes
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1">
      <header class="flex items-center justify-between border-b border-zinc-200 bg-white px-8 py-4">
        <h1 class="text-lg font-semibold text-zinc-900">Dashboard</h1>
        <span id="live-indicator" class="flex items-center gap-1.5 rounded-full bg-zinc-100 px-3 py-1 text-xs font-medium text-zinc-600">
          <span class="h-2 w-2 rounded-full bg-green-500"></span> LOCAL
        </span>
      </header>

      <div class="p-8">
        <!-- Operations Command banner -->
        <div class="flex items-center justify-between rounded-2xl bg-gradient-to-r from-red-800 to-red-900 p-6 text-white">
          <div>
            <h2 class="text-xl font-semibold">Operations Command</h2>
            <p class="mt-1 text-sm text-red-100">Tracking events and staffing for the next 30 days.</p>
          </div>
          <div class="flex gap-3">
            <div class="rounded-xl bg-red-950/40 px-5 py-3 text-center">
              <div id="stat-events" class="text-2xl font-bold">0</div>
              <div class="text-xs uppercase tracking-wide text-red-100">Total Events</div>
            </div>
            <div class="rounded-xl bg-red-950/40 px-5 py-3 text-center">
              <div id="stat-pto" class="text-2xl font-bold">0</div>
              <div class="text-xs uppercase tracking-wide text-red-100">PTO Days</div>
            </div>
          </div>
        </div>

        <!-- Content grid -->
        <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-3">
          <div class="lg:col-span-2">
            <div class="mb-3 flex items-center justify-between">
              <a href="https://airtable.com/appYVkKcbQKscED3w/shr4fcBr1I5ZwGXbi/tblaUxHoVkUK6Alyw" target="_blank" rel="noopener" class="flex items-center gap-2 text-sm font-semibold text-zinc-800 hover:text-red-700 hover:underline" title="Open the Airtable calendar">📋 Upcoming Events</a>
              <button id="add-event-btn" class="flex items-center gap-1 rounded-lg bg-red-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-800">
                + Add Event
              </button>
            </div>
            <div id="events-list"></div>
          </div>

          <div>
            <div class="rounded-xl border border-zinc-200 bg-white p-4">
              <div class="mb-2 flex items-center justify-between">
                <a href="https://docs.google.com/spreadsheets/d/1D3qjMSogKF35RQFRyWHAORD9Q-G5Dab5Slmq_IWt-MM/edit?usp=sharing" target="_blank" rel="noopener" class="flex items-center gap-2 text-sm font-semibold text-zinc-800 hover:text-red-700 hover:underline" title="Open the PTO Google Sheet">👥 PTO Tracking</a>
                <button id="pto-add-btn" class="text-zinc-400 hover:text-red-700">+</button>
              </div>
              <div id="pto-list" class="max-h-[560px] overflow-y-auto"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
